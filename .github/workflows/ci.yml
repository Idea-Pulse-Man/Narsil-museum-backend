name: CI

# Type-check, test and build on every push and pull request. The EC2 server
# still deploys by hand (`npm run deploy` there) — this only proves main is
# safe to deploy.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
